services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-spring_webflux_tutorial}
      POSTGRES_USER: ${POSTGRES_USER:-spring_webflux_tutorial}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spring_webflux_tutorial}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spring_webflux_tutorial}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      R2DBC_URL: ${R2DBC_URL:-r2dbc:postgresql://db:5432/spring_webflux_tutorial}
      FLYWAY_URL: ${FLYWAY_URL:-jdbc:postgresql://db:5432/spring_webflux_tutorial}
      DB_USERNAME: ${DB_USERNAME:-spring_webflux_tutorial}
      DB_PASSWORD: ${DB_PASSWORD:-spring_webflux_tutorial}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8080:8080"

volumes:
  db-data:
